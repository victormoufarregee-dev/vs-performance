# Suite do VS Performance: roda só o que está versionado no Git.
# Sem credencial do Supabase, sem segredo, nada escreve no banco (os testes SQL
# rodam à parte, no SQL Editor, em transação desfeita — ver test/README.md).
name: testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: suite (node test/run.js)
        run: node test/run.js --sem-cor
      - name: estaticos (node test/estatico.js)
        run: node test/estatico.js
      - name: mutantes (node test/mutantes.js)
        run: node test/mutantes.js
